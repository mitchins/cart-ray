[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cart-ray"
version = "0.0.1"
description = "A small, Stripe-first commerce kernel for static storefronts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["kinglet>=1.8.3,<2"]
license = { file = "LICENSE" }
authors = [{ name = "CartRay contributors" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12", "workers-py", "workers-runtime-sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/cartray"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
