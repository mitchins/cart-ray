<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squirrel’s Acorn Store</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/acorn.css">
</head>
<body data-product-key="{{PRODUCT_KEY}}">
  <main>
    <header><a href="/" data-store-name>Squirrel’s Acorn Store</a><h1 data-store-name>Squirrel’s Acorn Store</h1><p>Little beginnings for a greener woodland.</p></header>
    <p id="status" role="status" aria-live="polite">Loading catalogue…</p>
    <section aria-labelledby="products-heading"><h2 id="products-heading">Our products</h2><div id="products"></div></section>
    <section id="reviews" aria-labelledby="reviews-heading" hidden><h2 id="reviews-heading">Customer reviews</h2><p id="reviews-status" role="status" aria-live="polite"></p><div id="review-list"></div><button type="button" id="reviews-more" hidden>Load more reviews</button></section>
    <section id="review-consent" aria-labelledby="review-consent-heading" hidden><h2 id="review-consent-heading">Review request</h2><p>Would you like one email asking for a review of your purchase? This is optional.</p><form><label><input type="checkbox" name="accept"> Yes, email me a review request.</label> <button type="submit">Save preference</button></form><p role="status" aria-live="polite"></p></section>
    <section aria-labelledby="cart-heading"><h2 id="cart-heading">Cart</h2><ul id="cart"></ul><button id="checkout" type="button" disabled>Checkout</button><a id="continue-shopping" href="/" hidden>Continue shopping</a></section>
  </main>
  <script src="/storefront-config.js"></script>
  <script type="module" src="/app.js"></script><script type="module" src="/reviews.mjs"></script><script type="module" src="/consent.mjs"></script>
</body>
</html>
