name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Test GEL compiler and connected adapter
        run: |
          python3 -m unittest discover -s examples/gel-theme-pack/tests -p 'test_*.py'
          node --test tests/gel_adapter.test.mjs examples/gel-theme-pack/tests/*.test.mjs
      - name: Test the Acorn reference storefront
        run: |
          uv run --locked pytest examples/acorn-store/tests/test_build.py
          node --test examples/acorn-store/tests/reviews.test.mjs examples/acorn-store/tests/reviews_gateway.test.mjs tests/review_summary_reader.test.mjs
      - name: Test the post-purchase test email handler
        run: node --test tests/post_purchase_email.test.mjs tests/post_purchase_email_workerd.test.mjs
      - name: Test provider reconciliation on Workerd and D1
        run: node --test modules/reviews/tests/provider_reconciliation_workerd.mjs
      - name: Test optional Reviews snapshot rehearsal
        run: REVIEWS_QUALIFICATION_BUILD=1 PYTHONPATH=modules/reviews/src uv run pytest modules/reviews/tests
      - name: Test native customer action gateway
        run: node --test modules/reviews/tests/order_access_gateway.test.mjs
      - name: Test resumable test-only installation operator
        run: |
          uv run --locked pytest modules/reviews/operator/tests
          node --test modules/reviews/operator/tests/*.test.mjs
      - name: Test Reviews moderation console
        run: node --test modules/reviews/console/tests/*.test.mjs
      - name: Test Reviews console fixture safety
        run: PYTHONPATH=modules/reviews/src uv run --locked pytest -q modules/reviews/console/tests/test_workerd_gateway.py
      - name: Build and inspect optional Reviews package
        run: |
          uv build modules/reviews --wheel --out-dir /tmp/cartray-reviews-wheel
          uv run python modules/reviews/tests/verify_wheel.py /tmp/cartray-reviews-wheel
      - name: Exercise Reviews installer, ingestion and Workerd D1 API
        run: uv run python modules/reviews/tests/workerd_integration.py
      - name: Qualify stalled uploads against direct Workerd
        run: uv run python modules/reviews/tests/stream_repro/direct_gate.py
      - name: Exercise local native Reviews lifecycle on Workerd and D1
        run: REVIEWS_TEST_VERBOSE=1 uv run python modules/reviews/tests/native_workerd.py
      - name: Exercise verified acquisition invitations on Workerd and D1
        run: REVIEWS_TEST_VERBOSE=1 uv run python modules/reviews/tests/native_acquisition_workerd.py
      - name: Exercise fenced suppression-key rotation on Workerd and D1
        run: REVIEWS_TEST_VERBOSE=1 PYTHONPATH=modules/reviews/src uv run --locked python modules/reviews/tests/suppression_rotation_workerd.py
      - name: Exercise suppressed historical recipient on Workerd and D1
        run: REVIEWS_TEST_VERBOSE=1 PYTHONPATH=modules/reviews/src uv run --locked python modules/reviews/tests/historical_recipient_workerd.py
      - name: Exercise authenticated staff moderation on Workerd and D1
        run: REVIEWS_TEST_VERBOSE=1 PYTHONPATH=modules/reviews/src uv run --locked python modules/reviews/tests/staff_workerd.py
      - name: Exercise staff provider reconciliation on Workerd and D1
        run: REVIEWS_TEST_VERBOSE=1 PYTHONPATH=modules/reviews/src uv run --locked python modules/reviews/tests/staff_provider_workerd.py
      - run: npm run test:reviews-publication
      - run: PYTHONPATH=modules/reviews/src uv run --locked python modules/reviews/publication/tests/local_qualification.py
      - name: Exercise native publication revision and withdrawal
        run: PYTHONPATH=modules/reviews/src uv run --locked python modules/reviews/publication/tests/local_native_qualification.py
      - run: npm run test:m11a-projection
      - run: npm run build:storefront
      - run: CARTRAY_STOREFRONT_EXPECTED_MODE=preview npm run test:storefront
      - run: CARTRAY_STOREFRONT_MODE=production CARTRAY_STOREFRONT_API_BASE_URL=https://api.test.invalid npm run build:storefront
      - run: CARTRAY_STOREFRONT_EXPECTED_MODE=production npm run test:storefront
      - name: Smoke-test the local Python Worker
        run: |
          uv run pywrangler dev --local --port 8796 --log-level=error &
          worker_pid=$!
          trap 'kill "$worker_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8796/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Smoke-test Workerd D1 and Web Crypto boundaries
        run: |
          uv run pywrangler d1 migrations apply cartray-workerd-smoke --local --config workerd-d1-smoke.toml
          python3 -c "from pathlib import Path; Path('/tmp/cartray-review-smoke.sql').write_text('\n'.join(p.read_text() for d in ('modules/reviews/migrations','modules/reviews/consent/migrations') for p in sorted(Path(d).glob('*.sql'))))"
          npx --no-install wrangler d1 execute DB --local --config workerd-d1-smoke.toml --file /tmp/cartray-review-smoke.sql
          uv run pywrangler dev --config workerd-d1-smoke.toml --local --port 8797 --log-level=error &
          worker_pid=$!
          trap 'kill "$worker_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8797/; then
              test "$(curl --fail --silent --show-error 'http://127.0.0.1:8797/?download=1')" = 'workerd private file'
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: uv build

  sonarqube:
    name: SonarQube Cloud
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install locked Worker test dependencies
        run: npm ci --ignore-scripts
      - name: Generate coverage reports
        run: |
          mkdir -p coverage
          uv sync --all-groups --locked
          uv run --locked pytest --cov=. --cov-report=xml:coverage/python.xml
          REVIEWS_QUALIFICATION_BUILD=1 PYTHONPATH=modules/reviews/src uv run --locked pytest modules/reviews/tests --cov=. --cov-append --cov-report=xml:coverage/python.xml
          uv run --locked pytest modules/reviews/operator/tests --cov=. --cov-append --cov-report=xml:coverage/python.xml
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('coverage/python.xml'); assert any(c.get('filename', '').startswith('modules/reviews/src/') and float(c.get('line-rate', '0')) > 0 for c in r.iter('class')), 'Reviews coverage missing from report'"
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/m11a.lcov tests/m11a_projection.test.mjs
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/post-purchase-email.lcov tests/post_purchase_email.test.mjs
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/reviews-gateway.lcov examples/acorn-store/tests/reviews_gateway.test.mjs modules/reviews/tests/order_access_gateway.test.mjs
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/reviews-public-reader.lcov examples/acorn-store/tests/reviews.test.mjs
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/reviews-provider.lcov modules/reviews/tests/provider_reconciliation.test.mjs
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/reviews-publication.lcov modules/reviews/publication/tests/*.test.mjs
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/reviews-console.lcov modules/reviews/console/tests/*.test.mjs
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/reviews-operator.lcov modules/reviews/operator/tests/*.test.mjs
      - name: Scan and await quality gate
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  gel-browsers:
    name: GEL connected browsers
    # Playwright 1.57 ships browser/dependency builds for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    # Ubuntu dependency downloads can exceed 15 minutes on slow runner mirrors.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Clear reference evidence before qualification
        run: rm -f examples/gel-theme-pack/evidence/connected-browser-*.json examples/gel-theme-pack/evidence/gallery-browser-*.json
      - name: Install pinned Playwright engines
        run: |
          # Avoid the hosted runner's regional mirror, observed stalling before tests.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          uv run --with playwright==1.57.0 python -m playwright install --with-deps chromium firefox webkit
      - name: Build connected themes and Northline contract fixture
        run: |
          port=4174
          for theme in minimal studio classic; do
            uv run python examples/acorn-store/build.py --gel examples/gel-theme-pack/gel/squirrel.json --theme "$theme" --output "/tmp/gel-connected-$theme"
            python3 -m http.server "$port" --directory "/tmp/gel-connected-$theme" > "/tmp/gel-http-$theme.log" 2>&1 &
            port=$((port + 1))
          done
          uv run python examples/gel-theme-pack/tests/build_northline_connected.py --output /tmp/gel-connected-northline-classic
          python3 -m http.server 4177 --directory /tmp/gel-connected-northline-classic > /tmp/gel-http-northline-classic.log 2>&1 &
          for port in 4174 4175 4176 4177; do
            curl --fail --silent --retry 20 --retry-delay 1 --retry-connrefused "http://127.0.0.1:$port/" > /dev/null
          done
      - name: Exercise every connected composition in Chromium, Firefox and WebKit
        run: |
          port=4174
          for theme in minimal studio classic northline-classic; do
            uv run --with playwright==1.57.0 python examples/gel-theme-pack/tests/connected_browser.py --origin "http://127.0.0.1:$port" --label "$theme" --engines chromium,firefox,webkit
            uv run --with playwright==1.57.0 python examples/gel-theme-pack/tests/gallery_browser.py --origin "http://127.0.0.1:$port" --label "$theme" --engines chromium,firefox,webkit
            port=$((port + 1))
          done
      - name: Exercise gallery failure and recovery states
        run: uv run --with playwright==1.57.0 python examples/gel-theme-pack/tests/gallery_browser.py --engines chromium,firefox,webkit
      - name: Exercise connected merchant catalogue route
        run: uv run --with playwright==1.57.0 python examples/ep-uat/connected_route_regression.py
      - name: Qualify native order-page CSP and resource controls
        run: uv run --with playwright==1.57.0 python tests/order_page_browser.py --output /tmp/order-page-browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gel-connected-browser-evidence
          path: |
            examples/gel-theme-pack/evidence/connected-browser-*.json
            examples/gel-theme-pack/evidence/gallery-browser-*.json
            /tmp/gel-http-*.log
            /tmp/order-page-browser/*.png
            examples/gel-theme-pack/screenshots/connected-*.png
            examples/gel-theme-pack/screenshots/gallery-*.png
