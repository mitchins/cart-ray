name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Test the Acorn reference storefront
        run: |
          uv run --locked pytest examples/acorn-store/tests/test_build.py
          node --test examples/acorn-store/tests/reviews.test.mjs
      - name: Test optional Reviews snapshot rehearsal
        run: REVIEWS_QUALIFICATION_BUILD=1 PYTHONPATH=modules/reviews/src uv run pytest modules/reviews/tests
      - name: Test Reviews recovery queue consumer
        run: node --test modules/reviews/tests/dispatch.test.mjs
      - name: Test Reviews synthetic due queue
        run: node --test modules/reviews/tests/automation_queue.test.mjs
      - name: Test signed Reviews intake subscriber
        run: node --test modules/reviews/tests/automation_intake_queue.test.mjs modules/reviews/tests/automation_intake_producer.test.mjs
      - name: Exercise Reviews outbox producer on Workerd and D1
        run: uv run --locked python modules/reviews/tests/local_producer_qualification.py
      - name: Test review consent bridge and Acorn UI
        run: node --test modules/reviews/consent/tests/*.test.mjs examples/acorn-store/tests/consent.test.mjs
      - name: Test Reviews moderation console
        run: node --test modules/reviews/console/tests/*.test.mjs
      - name: Test Reviews console fixture safety
        run: PYTHONPATH=modules/reviews/src uv run --locked pytest -q modules/reviews/console/tests/test_workerd_gateway.py
      - name: Build and inspect optional Reviews package
        run: |
          uv build modules/reviews --wheel --out-dir /tmp/cartray-reviews-wheel
          uv run python modules/reviews/tests/verify_wheel.py /tmp/cartray-reviews-wheel
      - name: Exercise Reviews installer, ingestion and Workerd D1 API
        run: uv run python modules/reviews/tests/workerd_integration.py
      - name: Qualify stalled uploads against direct Workerd
        run: uv run python modules/reviews/tests/stream_repro/direct_gate.py
      - name: Exercise local native Reviews lifecycle on Workerd and D1
        run: REVIEWS_TEST_VERBOSE=1 uv run python modules/reviews/tests/native_workerd.py
      - name: Exercise verified acquisition invitations on Workerd and D1
        run: REVIEWS_TEST_VERBOSE=1 uv run python modules/reviews/tests/native_acquisition_workerd.py
      - name: Exercise Reviews no-backfill activation on Workerd and D1
        run: REVIEWS_TEST_VERBOSE=1 PYTHONPATH=modules/reviews/src uv run --locked python modules/reviews/tests/activation_workerd.py
      - name: Exercise authenticated staff moderation on Workerd and D1
        run: REVIEWS_TEST_VERBOSE=1 PYTHONPATH=modules/reviews/src uv run --locked python modules/reviews/tests/staff_workerd.py
      - run: npm run test:reviews-publication
      - run: PYTHONPATH=modules/reviews/src uv run --locked python modules/reviews/publication/tests/local_qualification.py
      - name: Exercise native publication revision and withdrawal
        run: PYTHONPATH=modules/reviews/src uv run --locked python modules/reviews/publication/tests/local_native_qualification.py
      - run: npm run test:m11a-projection
      - run: npm run build:storefront
      - run: CARTRAY_STOREFRONT_EXPECTED_MODE=preview npm run test:storefront
      - run: CARTRAY_STOREFRONT_MODE=production CARTRAY_STOREFRONT_API_BASE_URL=https://api.test.invalid npm run build:storefront
      - run: CARTRAY_STOREFRONT_EXPECTED_MODE=production npm run test:storefront
      - name: Smoke-test the local Python Worker
        run: |
          uv run pywrangler dev --local --port 8796 --log-level=error &
          worker_pid=$!
          trap 'kill "$worker_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8796/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Smoke-test Workerd D1 and Web Crypto boundaries
        run: |
          uv run pywrangler d1 migrations apply cartray-workerd-smoke --local --config workerd-d1-smoke.toml
          uv run pywrangler dev --config workerd-d1-smoke.toml --local --port 8797 --log-level=error &
          worker_pid=$!
          trap 'kill "$worker_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8797/; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: uv build

  sonarqube:
    name: SonarQube Cloud
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Generate coverage reports
        run: |
          mkdir -p coverage
          uv sync --all-groups --locked
          uv run --locked pytest --cov=. --cov-report=xml:coverage/python.xml
          REVIEWS_QUALIFICATION_BUILD=1 PYTHONPATH=modules/reviews/src uv run --locked pytest modules/reviews/tests --cov=. --cov-append --cov-report=xml:coverage/python.xml
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('coverage/python.xml'); assert any(c.get('filename', '').startswith('modules/reviews/src/') and float(c.get('line-rate', '0')) > 0 for c in r.iter('class')), 'Reviews coverage missing from report'"
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/m11a.lcov tests/m11a_projection.test.mjs
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/reviews-dispatch.lcov modules/reviews/tests/dispatch.test.mjs
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/reviews-automation-queue.lcov modules/reviews/tests/automation_queue.test.mjs
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/reviews-publication.lcov modules/reviews/publication/tests/*.test.mjs
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/reviews-console.lcov modules/reviews/console/tests/*.test.mjs
      - name: Scan and await quality gate
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
