name = "cartray-test"
account_id = "33623e6d0b4793842a1832c5512aeb49"
main = "src/cartray/worker.py"
compatibility_date = "2026-08-31"
compatibility_flags = ["python_workers"]
workers_dev = true

[build]
command = "uv run python scripts/sync_worker_source.py"

[vars]
CARTRAY_ENVIRONMENT = "test"
CARTRAY_SUCCESS_URL = "https://cart-ray.invalid/purchase-complete/"
CARTRAY_CANCEL_URL = "https://cart-ray.invalid/checkout-cancelled/"

[[d1_databases]]
binding = "DB"
database_name = "cartray-test"
database_id = "1c5c2dab-e81c-43e4-b361-dee9a5249e3d"
migrations_dir = "migrations"
