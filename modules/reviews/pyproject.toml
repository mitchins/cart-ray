[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cartray-reviews"
version = "0.0.3"
requires-python = ">=3.12"
description = "Optional CartRay Reviews public snapshot contract"

[tool.hatch.build.targets.wheel]
packages = ["src/cartray_reviews"]

[tool.hatch.build.targets.wheel.force-include]
"module.json" = "cartray_reviews/module.json"
"migrations" = "cartray_reviews/migrations"
