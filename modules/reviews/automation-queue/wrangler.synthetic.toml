# Explicit disposable test configuration; no production binding or sender.
name = "cartray-reviews-synthetic-due-consumer"
main = "worker.mjs"
compatibility_date = "2026-08-31"
workers_dev = false

[vars]
REVIEWS_ENVIRONMENT = "test"
REVIEWS_AUTOMATION_QUEUE = "test"

[[services]]
binding = "REVIEWS_API"
service = "cartray-reviews-acquisition-local-test"

[[queues.consumers]]
queue = "cartray-reviews-synthetic-due"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "cartray-reviews-synthetic-due-dlq"
